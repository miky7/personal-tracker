<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Widget del Libretto</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<style>
:root{--bg:#0A1114;--fg:#F4F7F8;--muted:rgba(244,247,248,.65);--accent:#FF9A55;--card:#121C20}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,"Segoe UI",system-ui,sans-serif;
  padding:calc(24px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}
main{width:100%;max-width:440px;display:flex;flex-direction:column;gap:16px}
h1{margin:0;font-size:34px;letter-spacing:-.03em;line-height:1.05}
h1 span{color:var(--accent)}
p,li{color:var(--muted)}
ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
button{border:0;border-radius:16px;padding:16px;font:inherit;font-weight:700;background:var(--fg);color:#0F1A1E}
#msg{min-height:1.5em;color:var(--accent);font-weight:600}
textarea{width:100%;min-height:160px;border-radius:12px;background:var(--card);color:var(--fg);border:1px solid rgba(255,255,255,.12);font:12px/1.4 ui-monospace,Menlo,monospace;padding:10px}
</style>
</head>
<body>
<main>
  <h1>Widget del Libretto<span>.</span></h1>
  <p>Questa pagina serve solo a copiare lo script del widget in Scriptable.</p>
  <button id="copy">Copia lo script</button>
  <div id="msg" role="status" aria-live="polite"></div>
  <ol>
    <li>Apri Scriptable e tocca <b>+</b>.</li>
    <li>Tocca il foglio vuoto e scegli <b>Incolla</b>.</li>
    <li>Tocca il titolo in alto e chiamalo <b>Libretto</b>, poi <b>Fine</b>.</li>
  </ol>
  <textarea id="code" readonly hidden></textarea>
</main>
<script>
const msg=document.getElementById('msg'),ta=document.getElementById('code');
let code=null;
fetch('widget/Libretto-widget.js',{cache:'no-store'}).then(r=>r.ok?r.text():Promise.reject()).then(t=>{code=t}).catch(()=>{msg.textContent='Non riesco a caricare lo script: controlla la connessione.'});
document.getElementById('copy').onclick=async()=>{
  if(!code){msg.textContent='Un attimo, sto ancora caricando…';return}
  try{await navigator.clipboard.writeText(code);msg.textContent='Copiato. Ora vai in Scriptable.'}
  catch(e){ta.hidden=false;ta.value=code;ta.focus();ta.select();msg.textContent='Copia a mano: tieni premuto nel riquadro, Seleziona tutto, Copia.'}
};
</script>
</body>
</html>
